<section class="imagen-texto" id="" data-cms-id=".ancla" data-cms-class="imagen-texto--derecha:.imagen_derecha, imagen-texto--suave:.fondo_suave" data-cms-item>
  <div class="imagen-texto__fila">
    <div class="imagen-texto__imagen rayado">
      <img src="" alt="" loading="lazy" data-cms-src=".imagen" data-cms-alt=".descripcion" data-cms-if=".imagen">
    </div>
    <div class="imagen-texto__cuerpo">
      <p class="imagen-texto__rotulo" data-cms=".rotulo" data-cms-optional>Cómo funciona</p>
      <h2 class="titulo-seccion" data-cms=".titulo">Explica el flujo principal en una frase.</h2>
      <p class="imagen-texto__texto" data-cms=".texto" data-cms-optional>Describe con más detalle cómo el usuario pasa del problema al resultado.</p>
      <div class="imagen-texto__pasos" data-cms-list=".pasos" data-cms-if=".pasos">
        <div class="imagen-texto__paso" data-cms-item><span data-cms=".">Primer paso del proceso</span></div>
      </div>
      <div class="imagen-texto__botones" data-cms-if=".boton.texto">
        <a class="boton boton--acento" href="#contacto" data-cms-href=".boton.enlace" data-cms=".boton.texto" data-cms-if=".boton.texto">Empezar ahora</a>
        <a class="boton boton--borde imagen-texto__boton2" href="#precios" data-cms-href=".boton2.enlace" data-cms=".boton2.texto" data-cms-if=".boton2.texto">Ver precios</a>
      </div>
    </div>
  </div>
</section>
