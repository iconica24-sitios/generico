<section class="testimonios" id="" data-cms-id=".ancla" data-cms-item>
  <div class="encabezado">
    <p class="rotulo" data-cms=".rotulo" data-cms-optional>Testimonios</p>
    <h2 class="titulo-seccion" data-cms=".titulo">Lo que dicen quienes ya lo usan.</h2>
    <p class="texto-seccion" data-cms=".texto" data-cms-optional>Una línea que presente a los clientes.</p>
  </div>
  <div class="testimonios__rejilla" data-cms-list=".citas">
    <figure class="testimonios__tarjeta" data-cms-item>
      <blockquote class="testimonios__cita">“<span data-cms=".cita">Una cita breve y específica.</span>”</blockquote>
      <figcaption class="testimonios__autor">
        <span class="testimonios__foto"><img src="" alt="" loading="lazy" data-cms-src=".foto" data-cms-if=".foto"></span>
        <span class="testimonios__datos"><span class="testimonios__nombre" data-cms=".nombre">Nombre Apellido</span><span class="testimonios__cargo" data-cms=".cargo">Cargo, Empresa</span></span>
      </figcaption>
    </figure>
  </div>
</section>
