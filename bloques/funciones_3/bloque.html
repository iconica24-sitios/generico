<section class="funciones-3" id="" data-cms-id=".ancla" data-cms-item>
  <div class="funciones-3__interior">
    <div class="encabezado" data-cms-if=".titulo">
      <p class="rotulo" data-cms=".rotulo" data-cms-optional>Funciones</p>
      <h2 class="titulo-seccion" data-cms=".titulo" data-cms-optional>Cada función, con su imagen.</h2>
      <p class="texto-seccion" data-cms=".texto" data-cms-optional>Resume en una o dos líneas lo que muestran las tarjetas.</p>
    </div>
    <div class="funciones-3__rejilla" data-cms-list=".tarjetas">
      <article class="funciones-3__tarjeta" data-cms-item>
        <div class="funciones-3__imagen rayado">
          <img src="" alt="" loading="lazy" data-cms-src=".imagen" data-cms-alt=".titulo" data-cms-if=".imagen">
        </div>
        <div class="funciones-3__cuerpo">
          <p class="funciones-3__categoria" data-cms=".categoria" data-cms-optional>Categoría</p>
          <h3 class="funciones-3__titulo" data-cms=".titulo">Función principal</h3>
          <p class="funciones-3__texto" data-cms=".texto">Describe el beneficio concreto, no la tecnología detrás.</p>
          <a class="funciones-3__enlace" href="#" data-cms-href=".enlace.url" data-cms=".enlace.texto" data-cms-if=".enlace.texto">Saber más</a>
        </div>
      </article>
    </div>
  </div>
</section>
