<section class="contacto-2" id="" data-cms-id=".ancla" data-cms-item>
  <div class="contacto-2__interior">
    <div class="encabezado">
      <h2 class="titulo-seccion" data-cms=".titulo">Escríbenos</h2>
      <p class="texto-seccion" data-cms=".texto" data-cms-optional>Cuéntanos qué necesitas y te respondemos en menos de 24 horas.</p>
    </div>
    <div class="contacto-2__cuerpo">
      <div class="contacto-2__enviado" hidden>
        <h3 data-cms=".enviado_titulo">Mensaje listo.</h3>
        <p data-cms=".enviado_texto">Se abrió tu aplicación de correo con el mensaje: sólo falta darle Enviar.</p>
      </div>
      <form class="contacto-2__form">
        <a class="contacto-2__destino" hidden href="mailto:" data-cms-href="mailto:{.correo_destino}"></a>
        <div class="contacto-2__fila">
          <label class="contacto-2__campo"><span class="contacto-2__etiqueta" data-cms=".formulario.nombre">Nombre</span><input name="nombre" required autocomplete="name"></label>
          <label class="contacto-2__campo"><span class="contacto-2__etiqueta" data-cms=".formulario.correo">Correo</span><input name="correo" type="email" required autocomplete="email"></label>
        </div>
        <label class="contacto-2__campo"><span class="contacto-2__etiqueta" data-cms=".formulario.mensaje">Mensaje</span><textarea name="mensaje" rows="5"></textarea></label>
        <div class="contacto-2__botones">
          <button type="submit" class="boton boton--acento contacto-2__boton" data-cms=".boton">Enviar mensaje</button>
          <a class="boton boton-whatsapp" href="https://wa.me/5215512345678" target="_blank" rel="noopener noreferrer" data-cms-href="https://wa.me/{.whatsapp}" data-cms-if=".whatsapp"><svg class="boton-whatsapp__icono" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path></svg><span data-cms=".whatsapp_texto">Escríbenos por WhatsApp</span></a>
        </div>
      </form>
      <div class="contacto-2__datos">
        <a class="contacto-2__correo" href="mailto:hola@tunegocio.com" data-cms-href="mailto:{.correo}" data-cms=".correo" data-cms-if=".correo">hola@tunegocio.com</a>
        <p class="contacto-2__direccion" data-cms=".direccion" data-cms-optional>Calle Ejemplo 123
Colonia Centro, Ciudad</p>
        <nav class="contacto-2__redes" aria-label="Redes sociales" data-cms-list="@sitio.pie.redes" data-cms-if="@sitio.pie.redes">
          <a class="contacto-2__red" href="#" target="_blank" rel="noopener noreferrer" data-cms-href=".url" data-cms-if=".url" data-cms-item>
            <svg data-cms-if=".red=facebook" role="img" aria-label="Facebook" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"></path></svg>
            <svg data-cms-if=".red=x" role="img" aria-label="X / Twitter" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"></path></svg>
            <svg data-cms-if=".red=instagram" role="img" aria-label="Instagram" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zm1.5-4.87h.01"></path></svg>
            <svg data-cms-if=".red=linkedin" role="img" aria-label="LinkedIn" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"></path><circle cx="4" cy="4" r="2"></circle></svg>
          </a>
        </nav>
      </div>
    </div>
  </div>
</section>
